[project]
name = "satquery"
version = "0.1.0"
description = "SatQuery AI: agentic vision-language assistant for satellite imagery (SIH 2026, PS SIH26167)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "pyproj>=3.6",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "transformers>=4.57",
    "accelerate>=1.0",
]
eval = [
    "pycocoevalcap>=1.2",
    "huggingface_hub>=0.25",
    "pyarrow>=17",
    "pandas>=2.2",
]

[project.scripts]
satquery-eval = "satquery.eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satquery"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["venv", "ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "NPY", "N"]
ignore = [
    "N803", # argument names like X / NIR are idiomatic in remote sensing
    "N806", # same for local variables
]

[tool.ruff.lint.isort]
known-first-party = ["satquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ml: needs the [ml] extra (torch/transformers); skipped otherwise",
    "eval: needs the [eval] extra; skipped otherwise",
]
